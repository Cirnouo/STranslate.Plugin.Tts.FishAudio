name: Feature request
description: Describe a user need or improvement for the Fish Audio plugin.
body:
  - type: checkboxes
    id: preparation
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and checked the current user guide.
          required: true
        - label: This request and its attachments contain no API keys, account identifiers, private text or signed URLs.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the task you are trying to complete and the difficulty you encounter.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      description: Describe the result that would help. An implementation proposal is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives
      description: Optional workarounds or other approaches you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional plugin or host versions, compatibility concerns, or sanitized examples. No paid synthesis is required for a feature request.
