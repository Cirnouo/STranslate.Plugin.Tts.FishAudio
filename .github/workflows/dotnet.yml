name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.event.created && !github.event.deleted && !github.event.forced
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read

  publish:
    name: Publish release
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out verified SHA and complete tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.403'
      - name: Download package from complete successful validation
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.verify.outputs.package-artifact }}
          path: .
      - name: Validate draft, upload and verify package, then publish
        shell: pwsh
        run: dotnet run --project tools/FishAudioRelease -c Release -- --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
