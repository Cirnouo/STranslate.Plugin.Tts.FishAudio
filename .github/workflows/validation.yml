name: Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
  workflow_call:
    outputs:
      package-artifact:
        description: Exact package artifact from the successful validation attempt
        value: ${{ jobs.build-test-package.outputs.package-artifact }}

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}

jobs:
  supply-chain-security:
    name: Supply chain security
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.403'
      - name: Audit all maintained NuGet dependency graphs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'STranslate.Plugin.Tts.FishAudio/STranslate.Plugin.Tts.FishAudio.csproj',
            'tests/STranslate.Plugin.Tts.FishAudio.Tests/STranslate.Plugin.Tts.FishAudio.Tests.csproj',
            'tools/FishAudioProbe/FishAudioProbe.csproj',
            'tools/FishAudioRelease/FishAudioRelease.csproj',
            'tools/FishAudio.Testing/FishAudio.Testing.csproj',
            'tests/FishAudio.Testing.Tests/FishAudio.Testing.Tests.csproj'
          )
          foreach ($project in $projects) {
            dotnet restore $project --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low '-p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905'
            if ($LASTEXITCODE -ne 0) { throw "NuGet audit/restore failed: $project" }
          }

  commit-messages:
    name: Commit messages
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate actual submitted commit subjects
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMMIT_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Commit identity must be an exact SHA value.' }
          if ($env:EVENT_NAME -eq 'pull_request') {
            if ($env:PR_BASE -cnotmatch '^[a-f0-9]{40}$' -or $env:PR_HEAD -cnotmatch '^[a-f0-9]{40}$') { throw 'PR commit identities must be exact SHA values.' }
            $range = "$($env:PR_BASE)..$($env:PR_HEAD)"
          } elseif ($env:PUSH_BEFORE -match '^[a-f0-9]{40}$' -and $env:PUSH_BEFORE -ne ('0' * 40)) {
            $range = "$($env:PUSH_BEFORE)..$($env:COMMIT_SHA)"
          } else {
            $range = "$($env:COMMIT_SHA)^!"
          }
          $subjects = @(git log --format=%s $range)
          if ($LASTEXITCODE -ne 0 -or $subjects.Count -eq 0) { throw 'Cannot establish submitted commit range.' }
          if ($env:EVENT_NAME -eq 'pull_request') { $subjects += $env:PR_TITLE }
          foreach ($subject in $subjects) {
            if ($subject -cnotmatch '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()\r\n]+\))?!?: \S.*$') {
              throw 'A submitted commit subject does not follow Conventional Commits.'
            }
          }

  hybrid-validation:
    name: Hybrid validation
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.403'
      - name: Reserve this attempt bundle
        shell: pwsh
        run: |
          . .\tools\HybridCi.Common.ps1
          try {
            $context = Get-HybridCiContext $env:GITHUB_WORKSPACE
            $bundle = Get-HybridCiBundlePath $context $context.attempt
            if ([IO.Directory]::Exists($bundle) -or [IO.File]::Exists($bundle)) { throw 'hybrid-ci-producer-not-fresh' }
            [IO.Directory]::CreateDirectory($bundle) | Out-Null
            Assert-HybridCiRegular $bundle -Directory
            "HYBRID_CI_BUNDLE=$bundle" >> $env:GITHUB_ENV
          } finally { Close-HybridCiLocks }
      - name: Run complete hybrid validation
        shell: pwsh
        run: |
          .\tools\TestHybrid.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -ResultsDirectory (Join-Path $env:HYBRID_CI_BUNDLE 'session')
          if ($LASTEXITCODE -ne 0) { throw 'Complete hybrid execution failed.' }
      - name: Independently admit complete hybrid session
        shell: pwsh
        run: |
          .\tools\Assert-HybridSession.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -SessionDirectory (Join-Path $env:HYBRID_CI_BUNDLE 'session') -OutputDirectory (Join-Path $env:HYBRID_CI_BUNDLE 'producer-admission')
          if ($LASTEXITCODE -ne 0) { throw 'Independent hybrid admission failed.' }
      - name: Record this hybrid attempt owner
        if: always()
        shell: pwsh
        run: .\tools\Write-HybridCiOwner.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
      - name: Preserve this complete hybrid attempt
        if: ${{ always() && env.HYBRID_CI_BUNDLE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hybrid-report-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HYBRID_CI_BUNDLE }}
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  build-test-package:
    outputs:
      package-artifact: ${{ steps.package-artifact.outputs.name }}
    if: ${{ always() }}
    needs: [supply-chain-security, commit-messages, hybrid-validation]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every validation prerequisite to succeed
        shell: pwsh
        env:
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain-security.result }}
          COMMITS_RESULT: ${{ needs.commit-messages.result }}
          HYBRID_RESULT: ${{ needs.hybrid-validation.result }}
        run: |
          if ($env:SUPPLY_CHAIN_RESULT -cne 'success' -or $env:COMMITS_RESULT -cne 'success' -or $env:HYBRID_RESULT -cne 'success') {
            throw 'Validation prerequisites did not all succeed.'
          }
      - name: Checkout exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.403'
      - name: Download all hybrid attempts from this workflow run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: hybrid-report-${{ github.sha }}-${{ github.run_id }}-*
          path: ${{ runner.temp }}/hybrid-reports
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Capture complete job attempt history
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\tools\GetRegressionJobAttempts.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP 'hybrid-job-attempts.json')
      - name: Rebuild current verifiers and independently admit complete hybrid evidence
        shell: pwsh
        run: |
          .\tools\VerifyHybridCi.ps1 -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'hybrid-reports') -JobAttemptsPath (Join-Path $env:RUNNER_TEMP 'hybrid-job-attempts.json') -ResultsDirectory (Join-Path $env:RUNNER_TEMP 'hybrid-verification')
          if ($LASTEXITCODE -ne 0) { throw 'Hybrid evidence verification failed.' }
      - name: Preserve independent hybrid aggregate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hybrid-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hybrid-verification
            ${{ runner.temp }}/hybrid-job-attempts.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Build and verify fresh Release package
        shell: pwsh
        run: .\build.ps1 -Release
      - name: Verify API probe safety and evidence capture offline
        shell: pwsh
        run: dotnet run --project tools/FishAudioProbe -c Release -- --self-test
      - name: Verify release protocol offline
        shell: pwsh
        run: dotnet run --project tools/FishAudioRelease -c Release -- --self-test
      - name: Canonicalize package container and verify unchanged payload identity
        shell: pwsh
        run: dotnet run --project tools/FishAudioRelease -c Release -- --canonicalize-package
      - name: Identify this validation attempt artifact
        id: package-artifact
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: '"name=verified-package-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT'
      - name: Validate release event, annotated tag and packaged manifest offline
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: dotnet run --project tools/FishAudioRelease -c Release -- --verify
      - name: Preserve exact verified release package
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package-artifact.outputs.name }}
          path: STranslate.Plugin.Tts.FishAudio.spkg
          if-no-files-found: error
          retention-days: 7
          overwrite: false
